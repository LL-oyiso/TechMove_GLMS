services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    networks:
      - glms-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMS_Api_Db;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      FxApi__ApiKey: "${FX_API_KEY}"
      Jwt__Key: "${JWT_KEY}"
      Auth__AdminUsername: "${ADMIN_USERNAME}"
      Auth__AdminPassword: "${ADMIN_PASSWORD}"
    depends_on:
      sql-server-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - glms-net

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS_Monolith/Dockerfile
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # Reach the API by its compose service name over the internal network.
      ApiBaseUrl: "http://glms-backend-api:8080"
    depends_on:
      - glms-backend-api
    ports:
      - "8081:8080"
    networks:
      - glms-net

networks:
  glms-net:
    driver: bridge
